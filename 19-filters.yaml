- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: linux, shell, Ansible, Terraform
    tagMap:
      name: Ansible
      project: roboshop
      environment: dev
    full_name: yuvaraj
    ip_address: 172.31.34.72
    tagsList: [
        {
            "key": "name",
            "value": "Ansible"
        },
        {
            "key": "project",
            "value": "roboshop"
        },
        {
            "key": "environment",
            "value": "dev"
        }
    ]
  tasks:
    - name: convert string to list
      debug:
        msg: "Topics are: {{ topics | split(',') }}"

    - name: set default value
      debug:
        msg: "Hi, {{ GREETING | default('Good Morning') }}"

    - name: convert map to list 
      debug:
        msg: "{{ tagMap | dict2items }}"

    - name: convert list to map
      debug:
        msg: "{{ tagList | items2dict }}"

    - name: convert lowercase to uppercase
      debug:
        msg: "{{ full_name | upper }}"

    - name: convert uppercase to lowercase
      debug:
        msg: "{{ full_name | lower }}"

    - name: check ipv4 address
      debug:
        msg: "{{ ip_address | ansible.utils.ipv4 }}"

    