- name: demo on shell vs command
  hosts: local
  connection: local
  tasks:
    - name: command test
      #command: cat /etc/passwd | grep root
      shell: cat /etc/passwd | grep root
      register: user_output

    - name: print output
      debug:
        msg: "{{ user_output }}"

    - name: list files
      #command: ls -ltr > /temp/file.txt
      shell: ls -ltr > /temp/file.txt
      

