- name: course information
  hosts: local
  connection: local
  vars:
    course: "DevSecOps with AIOps"
    duration_in_hrs: 150
    is_live_sessions: true
    topics:
      - linux
      - shell
      - ansible
    more_details:
      months: "5"
      trainer: "Sivakumar Reddy"
  tasks:
  - name: print information
    debug:
      msg: |
        name: {{ course }}
        duration: {{ duration_in_hrs }}
        is_it_live: {{ is_live_sessions }}
        topics: {{ topics }}
        more_details: {{ more_details }}
